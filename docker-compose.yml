services:
  postgres:
    image: postgres:16
    container_name: ng-alumni-postgres
    environment:
      POSTGRES_DB: ng_alumni
      POSTGRES_USER: alumni_user
      POSTGRES_PASSWORD: alumniNG1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: